<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Svenska Lätt | cookies</title><link rel="icon" href="./favicon.svg"><style>:root{--ink:#292444;--purple:#6257e7}*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:var(--ink);margin:0;background:linear-gradient(145deg,#f4f2ff,#ecf9ff)}main{max-width:840px;margin:5vh auto;padding:clamp(20px,4vw,48px);border-radius:25px;background:#fff;box-shadow:0 20px 60px #302b781a}header{display:flex;gap:13px;align-items:center;margin-bottom:22px}header img{width:48px;height:48px}header strong{font-size:19px}.back{display:inline-flex;margin-bottom:22px;color:#4a39ba;font-weight:800;text-decoration:none;padding:8px 12px;border:1px solid #ded6ff;border-radius:10px}h1{font-size:clamp(27px,4vw,36px);line-height:1.2;margin:0 0 17px}h2{font-size:18px;margin-bottom:7px}section{padding:12px 0;border-bottom:1px solid #ececf3}section:last-of-type{border:0}p{margin:0 0 10px;color:#5c5d76}.warning{padding:14px 18px;background:#fff5df;border:1px solid #f1d49a;border-radius:13px;margin-bottom:20px}footer{font-size:13px;color:#75758b;margin-top:30px}@media(max-width:890px){main{margin:10px;border-radius:18px}}</style></head><body><main><header><img src="./favicon.svg" alt=""><strong>Svenska Lätt</strong></header><a class="back" href="./index.html#home" id="back">← Back</a><h1 id="heading"></h1><div class="warning" id="warning"></div><div id="parts"></div><footer>© 2026 Svenska Lätt · <a href="./index.html#home">Home</a></footer></main><script>const I18N={"ru": ["Cookie и локальное хранение", [["Что используется", "Для гостевого обучения используются данные localStorage: прогресс, выбранный язык, уровень SFI и история повторений. Это техническое хранение в браузере, не рекламные cookie."], ["Выбор", "Карточка на сайте сохраняет ваш выбор принять или отклонить необязательные cookie. В текущей сборке необязательные аналитические и ористовувати дані сесії після підключення авторизації. Текст слід оновити після інтеграції."]]]};const lang=(localStorage.getItem('sv-language')||'ru').toLowerCase();const active=I18N[lang]||I18N.ru;const labels={ru:['← Вернуться на сайт','Перед публикацией укажите владельца сервиса, контактный адрес и проверьте юридические условия.'],en:['← Back to site','Before public launch, add the service owner and contact details and review these legal terms.'],sv:['← Tillbaka till webbplatsen','Fyll i ägare och kontaktuppgifter och granska juridiken före offentlig lansering.'],uk:['← Повернутися на сайт','До публічного запуску вкажіть власника, контакти й перевірте юридичні умови.']}[lang]||['← Back','This draft needs owner details'];document.documentElement.lang=lang;document.querySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];text.textContent=item[1];sec.append(h,text);parent.append(sec)});</script></body></html>
