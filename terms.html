", "Svenska Lätt — независимое обучающее приложение для самостоятельной практики шведского языка. Это не государственная школа и не официальный экзамен SFI."], ["Учебные материалы", "Объяснения и упражнения служат для обучения. Ссылки на официальные источники предоставляются отдельно. Доступность внешних видео и озвучивания зависит от сервиса и устройства."], ["Аккаунт и прогресс", "Гостевой прогресс хранится в браузере. Supabase используется для регистрации, авторизации и хранения прогресса аккаунта. Выход из аккаунта не удаляет облачные данные. Запрос на удаление можно отправить на yuliia.milena@gmail.com; полная процедура и сроки окончательного удаления пока не подтверждены."], ["Допустимое использование", "Не используйте приложение для неправомерного доступа, автоматизированных атак и распространения вредоносного содержимого."], ["Изменения", "Обновлено 18 октября 2026. Полное юридическое имя владельца, почтовый адрес и применимое право не подтверждены; сроки хранения и окончательного удаления не установлены этим документом. Условия остаются черновиком."]]], "en": ["Terms of use", [["Owner and contact", "Svenska Lätt is owned by a private individual, not a company. Public contact for support and personal data requests: yuliia.milena@gmail.com. The owner’s full legal name and postal address have not yet been provided. BLOCKER: the owner’s identification details must be completed before this document is finalized."], ["Purpose", "Svenska Lätt is an independent tool for practising Swedish. It is not a government school or official SFI exam."], ["Learning content", "Guides and quizzes are educational. Official references are linked separately. External video and speech access depends on third parties and devices."], ["Accounts", "Guest progress is stored in the browser. Supabase is used for registration, authentication and account progress storage. Signing out does not delete cloud data. Erasure requests can be sent to yuliia.milena@gmail.com; the complete process and final deletion times have not yet been confirmed."], ["Use", "Do not misuse the service for unauthorised access, attacks or malicious content."], ["Updates", "Updated 18 October 2026. The owner’s full legal name, postal address and governing law are unconfirmed; this document does not establish retention or final deletion periods. These terms remain a draft."]]], "sv": ["Användarvillkor", [["Ägare och kontakt", "Svenska Lätt ägs av en privatperson, inte av ett företag. Offentlig kontakt för support och frågor om personuppgifter: yuliia.milena@gmail.com. Ägarens fullständiga juridiska namn och postadress har ännu inte angetts. BLOCKER: ägarens identitetsuppgifter måste kompletteras innan dokumentet är färdigt."], ["Syfte", "Svenska Lätt är en fristående tjänst för att öva svenska. Den är ingen myndighetsskola eller officiell sfi-examen."], ["Innehåll", "Regler och övningar är för lärande. Officiella källor länkas separat. Externa videor och uppläsning beror på andra leverantörer och enheter."], ["Konton", "Gästframsteg lagras i webbläsaren. Supabase används för registrering, autentisering och lagring av kontoframsteg. Utloggning raderar inte molnuppgifter. Begäran om radering kan skickas till yuliia.milena@gmail.com; hela rutinen och tiden för slutlig radering har ännu inte bekräftats."], ["Användning", "Missbruka inte tjänsten för obehörig åtkomst, angrepp eller skadligt innehåll."], ["Ändringar", "Uppdaterad 18 oktober 2026. Ägarens fullständiga juridiska namn, postadress och tillämplig lag är inte bekräftade; dokumentet fastställer inte lagringstider eller tid för slutlig radering. Villkoren är fortfarande ett utkast."]]], "uk": ["Умови використання", [["Власник і контакт", "Svenska Lätt належить фізичній особі, а не компанії. Публічний контакт із питань підтримки та персональних даних: yuliia.milena@gmail.com. Повне юридичне ім’я власника та поштова адреса поки не надані. BLOCKER: відомості для ідентифікації власника потрібно доповнити до завершення документа. erySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];item[1].split('yuliia.milena@gmail.com').forEach((part,index)=>{if(index){const link=document.createElement('a');link.href='mailto:yuliia.milena@gmail.com';link.textContent='yuliia.milena@gmail.com';text.append(link)}text.append(document.createTextNode(part))});sec.append(h,text);parent.append(sec)});</script></body></html>
