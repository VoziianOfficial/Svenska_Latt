Это не государственная школа и не официальный экзамен SFI."], ["Учебные материалы", "Объяснения и упражнения служат для обучения. Ссылки на официальные источники предоставляются отдельно. Доступность внешних видео и озвучивания зависит от сервиса и устройства."], ["Аккаунт и прогресс", "Гостевой прогресс хранится в браузере. Supabase используется для регистрации, авторизации и хранения учебного прогресса. Выход из аккаунта не удаляет облачные данные. Зарегистрированные пользователи могут самостоятельно удалить аккаунт в профиле после подтверждения пароля. Запросы на удаление можно направлять на yuliia.milena@gmail.com. Резервные копии и технические журналы обрабатываются отдельно."], ["Возрастное ограничение", "Svenska Lätt предназначена для пользователей от 16 лет. При регистрации пользователь подтверждает, что ему исполнилось 16 лет. Дата рождения и документы не запрашиваются; независимая проверка возраста не проводится."], ["Допустимое использование", "Не используйте приложение для неправомерного доступа, автоматизированных атак и распространения вредоносного содержимого."], ["Изменения", "Обновлено 26 октября 2026 года. Локальные резервные копии запланировано удалять после 30 дней. Сроки хранения данных у внешних провайдеров регулируются отдельно. Почтовый адрес и условия применимого права ещё уточняются. Документ находится на проверке."]]], "en": ["Terms of use", [["Owner and contact", "Svenska Lätt is owned and operated by Yuliia Voziian, a private individual and data controller. Contact: yuliia.milena@gmail.com. A postal contact address for legal correspondence remains to be confirmed."], ["Purpose", "Svenska Lätt is an independent tool for practising Swedish. It is not a government school or official SFI exam."], ["Learning content", "Guides and quizzes are educational. Official references are linked separately. External video and speech access depends on third parties and devices."], ["Accounts", "Guest progress is stored in the browser. Supabase provides registration, authentication and cloud learning progress. Signing out does not delete cloud data. Registered users can delete their account in their profile after password confirmation. Erasure requests can be sent to yuliia.milena@gmail.com. Backups and technical logs are handled separately."], ["Age requirement", "Svenska Lätt is intended for users aged 16 or older. During registration, users confirm that they are at least 16. Dates of birth and identity documents are not collected; age is not independently verified."], ["Use", "Do not misuse the service for unauthorised access, attacks or malicious content."], ["Updates", "Updated 26 October 2026. Local backups are scheduled for deletion after 30 days. External providers have separate retention arrangements. Postal contact details and applicable-law wording remain under review. This document is still being finalized."]]], "sv": ["Användarvillkor", [["Ägare och kontakt", "Svenska Lätt ägs och drivs av Yuliia Voziian, en privatperson och personuppgiftsansvarig. Kontakt: yuliia.milena@gmail.com. En postadress för juridisk korrespondens behöver fortfarande fastställas."], ["Syfte", "Svenska Lätt är en fristående tjänst för att öva svenska. Den är ingen myndighetsskola eller officiell sfi-examen."], ["Innehåll", "Regler och övningar är för lärande. Officiella källor länkas separat. Externa videor och uppläsning beror på andra leverantörer och enheter."], ["Konton", "Gästframsteg lagras i webbläsaren. Supabase används för registrering, autentisering och lagring av studieresultat. Utloggning raderar inte molnuppgifter. Registrerade användare kan själva radera sitt konto i profilen efter lösenordsbekräftelse. Begäran om radering kan skickas till yuliia.milena@gmail.com. Säkerhetskopior och tekniska loggar hanteras separat."], ["Åldersgräns", "Svenska Lätt är avsedd för användare som är minst 16 år. Vid registrering bekräftar användaren att hen är minst 16 år. Födelsedatum och identitetshandlingar samlas inte in; åldern kontrolleras inte oberoende."], ["Användning", "Missbruka inte tjänsten för obehörig åtkomst, angrepp eller skadligt innehåll."], ["Ändringar", "Uppdaterad 26 oktober 2026. Lokala säkerhetskopior schemaläggs för radering efter 30 dagar. Externa leverantörer har separata lagringsvillkor. Postadress och formuleringen om tillämplig lag granskas fortfarande. Dokumentet är ännu inte färdigt."]]], "uk": ["Умови використання", [["Власник і контакт", "Власниця Svenska Lätt та відповідальна за обробку персональних даних — Yuliia Voziian, фізична особа. Контакт: yuliia.milena@gmail.com. Поштова адреса для юридичного листування ще потребує уточнення."], ["Призначення", "Svenska Lätt — незалежний сервіс для практики шведської мови, а не офіційна школа чи іспит SFI."], ["Навчання", "Правила та вправи навчальні. Посилання на офіційні джерела наведені окремо. Доступність відео й озвучення залежить від зовнішніх сервісів та пристроїв."], ["Акаунти", "Гостьовий прогрес зберігається в браузері. Supabase використовується для реєстрації, авторизації та зберігання навчального прогресу. Вихід з акаунта не видаляє хмарні дані. Зареєстровані користувачі можуть самостійно видалити акаунт у профілі після підтвердження пароля. Запити на видалення можна надсилати на yuliia.milena@gmail.com. Резервні копії та технічні журнали обробляються окремо."], ["Вікове обмеження", "Svenska Lätt призначена для користувачів віком від 16 років. Під час реєстрації користувач підтверджує, що йому виповнилося 16 років. Дата народження й документи не запитуються; незалежна перевірка віку не проводиться."], ["Використання", "Заборонено використовувати сервіс для несанкціонованого доступу, атак і шкідливого вмісту."], ["Зміни", "Оновлено 26 жовтня 2026 року. Локальні резервні копії заплановано видаляти після 30 днів. Зовнішні провайдери мають окремі правила зберігання. Поштова адреса й положення про застосовне право ще уточнюються. Документ перебуває на перевірці."]]]};const lang=((()=>{try{return localStorage.getItem('sv-language')}catch(_){return null}})()||'ru').toLowerCase();const active=I18N[lang]||I18N.ru;const labels={"ru": ["← Вернуться на сайт", "Сведения о владельце и удалении аккаунтов актуализированы. Правовые основания отдельных видов обработки и почтовый контактный адрес требуют окончательной юридической проверки."], "en": ["← Back to site", "Owner and account deletion information has been updated. Legal bases for certain processing activities and the postal contact address remain subject to final legal review."], "sv": ["← Tillbaka till webbplatsen", "Uppgifter om ägaren och kontoradering har uppdaterats. Rättsliga grunder för viss behandling och postadressen behöver fortfarande granskas juridiskt."], "uk": ["← Повернутися на сайт", "Відомості про власницю та видалення акаунтів оновлено. Правові підстави окремих видів обробки та поштова контактна адреса ще потребують остаточної юридичної перевірки."]}[lang]||['← Back','Draft: owner details and erasure procedure remain unconfirmed.'];document.documentElement.lang=lang;document.querySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];item[1].split('yuliia.milena@gmail.com').forEach((part,index)=>{if(index){const link=document.createElement('a');link.href='mailto:yuliia.milena@gmail.com';link.textContent='yuliia.milena@gmail.com';text.append(link)}text.append(document.createTextNode(part))});sec.append(h,text);parent.append(sec)});</script></body></html>
