<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Svenska Lätt | privacy</title><link rel="icon" href="./favicon.svg"><style>:root{--ink:#292444;--purple:#6257e7}*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:var(--ink);margin:0;background:linear-gradient(145deg,#f4f2ff,#ecf9ff)}main{max-width:840px;margin:5vh auto;padding:clamp(20px,4vw,48px);border-radius:25px;background:#fff;box-shadow:0 20px 60px #302b781a}header{display:flex;gap:13px;align-items:center;margin-bottom:22px}header img{width:48px;height:48px}header strong{font-size:19px}.back{display:inline-flex;margin-bottom:22px;color:#4a39ba;font-weight:800;text-decoration:none;padding:8px 12px;border:1px solid #ded6ff;border-radius:10px}h1{font-size:clamp(27px,4vw,36px);line-height:1.2;margin:0 0 17px}h2{font-size:18px;margin-bottom:7px}section{padding:12px 0;border-bottom:1px solid #ececf3}section:last-of-type{border:0}p{margin:0 0 10px;color:#5c5d76}.warning{padding:14px 18px;background:#fff5df;border:1px solid #f1d49a;border-radius:13px;margin-bottom:20px}footer{font-size:13px;color:#75758b;margin-top:30px}@media(max-width:890px){main{margin:10px;border-radius:18px}}</style></head><body><main><header><img src="./favicon.svg" alt=""><strong>Svenska Lätt</strong></header><a class="back" href="./index.html#home" id="back">← Back</a><h1 id="heading"></h1><div class="warning" id="warning"></div><div id="parts"></div><p><a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj" target="_blank" rel="noopener noreferrer">GDPR</a> · <a href="https://supabase.com/docs/guides/platform/backups" target="_blank" rel="noopener noreferrer">Supabase backups</a></p><footer>© 2026 Svenska Lätt · <a href="./index.html#home">Home</a></footer></main><script>const I18N={"ru": ["Конфиденциальность — черновик, BLOCKER", [["Статус документа и владелец", "Черновик от 18 октября 2026 для Svenska Lätt: https://voziianofficial.github.io/Svenska_Latt/. BLOCKER: не подтверждены юридическое имя контролёра данных и публичный контактный email. Этот документ нельзя считать завершённым уведомлением для публичного запуска."], ["Какие данные и зачем", "Гостевой прогресс хранится в браузере. Для аккаунта Supabase обрабатывает email и данные авторизации; приложение сохраняет имя и данные профиля, уровень SFI, настройки языка, XP, ответы и результаты тестов, достижения, избранное, изученные слова, повторения и даты активности. Это используется для входа, синхронизации, упражнений и статистики. BLOCKER: контролёр должен подтвердить правовое основание для каждой цели и необходимые/необязательные поля."], ["Учебное время и согласие", "Активное учебное время учитывается по умолчанию для вошедшего аккаунта согласно текущей настройке сервиса. Выключатель в кабинете позволяет остановить учёт; явное выключение сохраняется. Записываются интервалы активности, дневные суммы и автоматически определённый часовой пояс. Скрытая вкладка, отсутствие фокуса и бездействие приостанавливают учёт. Уже записанное время при выключении не удаляется. BLOCKER: контролёр должен подтвердить правовое основание этой обработки; включённая настройка по умолчанию сама по себе не является отдельным согласием."], ["Хранение в браузере и cookies", "localStorage содержит гостевой прогресс, настройки, выбор cookies, выбор учёта времени и данные сессии Supabase. Старые локальные данные аккаунта не импортируются автоматически. IndexedDB хранит очереди событий и интервалов до подтверждения; отдельные подтверждённые и отклонённые записи могут оставаться без автоматического удаления. sessionStorage хранит текущую тренировку и идентификатор временной сессии. Service Worker кеширует публичные файлы и изображения, а не ответы Supabase. Аналитические и рекламные cookies в коде не обнаружены. Локальный Python-сервер имеет отдельную cookie svsession на 30 дней; GitHub Pages этот сервер не запускает."], ["Получатели и внешние сервисы", "GitHub Pages размещает сайт; Supabase используется для Auth, PostgreSQL и приватного хранилища аватаров. SDK загружается с jsDelivr, шрифты — с Google Fonts. В коде есть подключения к Pexels и Wikimedia; текущие 1006 учебных фото включены локально. Внешние видео открываются на сайтах правообладателей, включая UR Play и SVT. Синтез речи зависит от браузера и установленного голоса и может использовать сервис устройства. При внешних запросах сервисам передаются сетевые сведения, например IP-адрес. BLOCKER: проверить фактический регион Supabase, договоры обработки, субподрядчиков и международные передачи."], ["Сроки и удаление", "В коде нет срока автоматического удаления учебных данных, истории событий и большинства локальных записей. Закрытие вкладки и выход из аккаунта не удаляют облачный прогресс. Очистка данных браузера пользователем может удалить несинхронизированный прогресс; она не удаляет аккаунт Supabase. SQL содержит только первый этап запроса удаления: замораживание аккаунта до очистки Storage. В интерфейсе нет завершённой процедуры окончательного удаления Auth-пользователя, файлов, резервных копий и журналов. BLOCKER: установить сроки/критерии хранения по категориям, реальные сроки резервных копий и логов, контакт и проверяемую процедуру удаления. Сроки по тарифам сервиса не подтверждают настройки этого проекта."], ["Права и обязательные уточнения", "В зависимости от основания и обстоятельств GDPR предусматривает доступ, исправление, удаление, ограничение обработки, переносимость, возражение, отзыв согласия и жалобу в надзорный орган. Выключение учёта времени не влияет на правомерность предшествующей обработки. BLOCKER: предоставить рабочий канал запросов, ответственное лицо, порядок проверки личности и сроков ответа; подтвердить применимый надзорный орган, условия для несовершеннолетних и наличие решений/профилирования, подпадающих под статью 22. Общая правовая рамка: GDPR, статьи 5–7, 12–22. Это перечень сведений для завершения документа, а не заявление о полном соответствии."]]], "en": ["Privacy — draft, BLOCKER", [["Draft and controller", "Draft dated 18 October 2026 for Svenska Lätt: https://voziianofficial.github.io/Svenska_Latt/. BLOCKER: the legal identity of the data controller and public contact email are unconfirmed. This is not a completed public launch notice."], ["Data and purposes", "Guest progress stays in the browser. Supabase handles account email and authentication. The app stores profile data/name, SFI level, language settings, XP, answers and learning results, achievements, favorites, known words, reviews and activity dates for sign-in, synchronization, exercises and statistics. BLOCKER: confirm the legal basis for each purpose and which fields are required."], ["Study time and consent", "Active study time is tracked by default for signed-in accounts according to the current service setting. The account switch stops tracking and retains an explicit opt-out. Activity intervals, daily totals and the automatically detected time zone are stored. Hidden/unfocused tabs and inactivity pause tracking. Switching off does not delete recorded time. BLOCKER: the controller must confirm the legal basis; a default-on setting is not a separate consent."], ["Browser storage and cookies", "localStorage holds guest progress, preferences, cookie choice, study-time preference and the Supabase session. Legacy account data is not imported automatically. IndexedDB holds event/time queues; some acknowledged or rejected records remain without automatic expiry. sessionStorage holds the current exercise and time lease ID. The Service Worker caches public assets, not Supabase responses. No analytics or advertising cookies were found in the code. The separate local Python server uses a 30-day svsession cookie; it does not run on GitHub Pages."], ["Services and recipients", "GitHub Pages hosts the site. Supabase supplies Auth, PostgreSQL and private avatar storage. jsDelivr delivers the SDK; Google Fonts delivers fonts. Code includes Pexels/Wikimedia connections; all 1006 current study photos are local assets. Video links open publishers such as UR Play and SVT. Speech synthesis depends on the browser/voice and may use device services. External requests disclose network information such as IP addresses. BLOCKER: verify the actual Supabase region, processing agreements, subprocessors and international transfers."], ["Retention and erasure", "No automatic retention period is implemented for learning history, event records or most local data. Signing out or closing a tab does not erase cloud progress. Browser-data removal can lose unsynchronized progress and does not delete the Supabase account. SQL only implements the initial deletion-request freeze pending Storage cleanup. No complete interface/workflow erases the Auth user, files, backups and logs. BLOCKER: define retention periods/criteria by category, actual backup/log retention and a verified erasure/contact procedure; service plan documentation does not verify this project’s settings."], ["Rights and outstanding details", "Depending on the legal basis and circumstances, GDPR provides rights of access, rectification, erasure, restriction, portability, objection, consent withdrawal and complaint to a supervisory authority. Withdrawal does not affect prior lawful processing. BLOCKER: provide a working request channel, responsible contact, identity-verification/response procedure; confirm the applicable authority, rules for minors and any Article 22 decision-making/profiling. Framework: GDPR Articles 5–7 and 12–22. This draft does not certify compliance."]]], "sv": ["Integritet — utkast, BLOCKER", [["Utkast och ansvarig", "Utkast 18 oktober 2026 för Svenska Lätt: https://voziianofficial.github.io/Svenska_Latt/. BLOCKER: personuppgiftsansvarigs juridiska namn och offentlig kontaktadress saknas. Informationen är inte färdig för offentlig lansering."], ["Uppgifter och ändamål", "Gästframsteg lagras i webbläsaren. Supabase hanterar e-post och autentisering. Appen lagrar profil/namn, SFI-nivå, språkval, XP, svar och testresultat, prestationer, favoriter, inlärda ord, repetition och aktivitetsdatum för inloggning, synkronisering, övningar och statistik. BLOCKER: bekräfta rättslig grund per ändamål och obligatoriska fält."], ["Samtycke till studietid", "Aktiv studietid registreras som standard för inloggade konton enligt tjänstens inställning. Reglaget i profilen stoppar registreringen och ett uttryckligt avval sparas. Aktivitetsintervall, dagssummor och automatiskt identifierad tidszon lagras. Dold flik, förlorat fokus och inaktivitet pausar registreringen. Tid som redan sparats raderas inte. BLOCKER: ansvarig måste bekräfta rättslig grund; en standardinställning är inte ett separat samtycke."], ["Lokal lagring och kakor", "localStorage innehåller gästframsteg, inställningar, kakval, tidsinställning och Supabase-sessionen. Äldre kontodata importeras inte automatiskt. IndexedDB lagrar händelse- och tidsköer; vissa bekräftade/avvisade poster saknar automatisk gallring. sessionStorage lagrar pågående övning och tids-ID. Service Worker cachar offentliga filer, inte Supabase-svar. Inga analys- eller reklamkakor hittades i koden. Den separata lokala Python-servern använder svsession i 30 dagar; den körs inte på GitHub Pages."], ["Externa tjänster", "GitHub Pages är webbhotell. Supabase används för Auth, PostgreSQL och privat avatarlagring. SDK hämtas från jsDelivr och typsnitt från Google Fonts. Koden ansluter även till Pexels/Wikimedia; alla 1006 aktuella studiefoton finns lokalt. Videolänkar öppnar bland annat UR Play och SVT. Talsyntes beror på webbläsare/röst och kan använda enhetstjänster. Externa anrop överför nätverksuppgifter som IP-adress. BLOCKER: verifiera faktisk Supabase-region, biträdesavtal, underbiträden och internationella överföringar."], ["Lagringstid och radering", "Koden har ingen automatisk lagringstid för studiehistorik, händelser och de flesta lokala poster. Utloggning raderar inte molnframsteg. Rensning i webbläsaren kan förlora osynkroniserade data men raderar inte Supabase-kontot. SQL har bara första steget för raderingsbegäran: spärr i väntan på Storage-rensning. Fullständig rutin för Auth-användare, filer, säkerhetskopior och loggar saknas. BLOCKER: fastställ lagringstider/kriterier per kategori, verkliga backup-/loggtider och verifierad raderingsrutin med kontakt. Tjänstens prisplan bekräftar inte projektets inställningar."], ["Rättigheter och återstående uppgifter", "GDPR ger, beroende på grund och omständigheter, rätt till tillgång, rättelse, radering, begränsning, portabilitet, invändning, återkallat samtycke och klagomål till tillsynsmyndighet. Återkallelse påverkar inte tidigare laglig behandling. BLOCKER: ange fungerande kontakt och rutin för identitetskontroll/svar; bekräfta myndighet, villkor för minderåriga och eventuell profilering/beslut enligt artikel 22. Ramverk: GDPR artiklarna 5–7 och 12–22. Utkastet intygar inte full efterlevnad."]]], "uk": ["Конфіденційність — чернетка, BLOCKER", [["Чернетка та відповідальний", "Чернетка від 18 жовтня 2026 для Svenska Lätt: https://voziianofficial.github.io/Svenska_Latt/. BLOCKER: не підтверджено юридичне ім’я контролера й публічний контактний email. Це не завершене повідомлення для публічного запуску."], ["Дані та мета", "Гостьовий прогрес зберігається в браузері. Supabase обробляє email та авторизацію. Зберігаються профіль/ім’я, рівень SFI, мова, XP, відповіді й результати тестів, досягнення, вибране, вивчені слова, повторення та дати активності для входу, синхронізації, вправ і статистики. BLOCKER: підтвердити правову підставу для кожної мети й обов’язкові поля."], ["Згода на облік часу", "Активний навчальний час обліковується за замовчуванням для авторизованого акаунта згідно з налаштуванням сервісу. Перемикач у кабінеті зупиняє облік, явне вимкнення зберігається. Записуються інтервали, денні підсумки й автоматично визначений часовий пояс. Прихована вкладка, втрата фокуса й бездіяльність призупиняють облік. Попередні записи не видаляються. BLOCKER: контролер має підтвердити правову підставу; типове ввімкнення не є окремою згодою."], ["Браузерне зберігання й cookie", "localStorage містить гостьовий прогрес, налаштування, вибір cookie, вибір обліку часу й сесію Supabase. Старі локальні дані акаунта не імпортуються автоматично. IndexedDB зберігає черги подій/часу; деякі підтверджені й відхилені записи лишаються без автоматичного очищення. sessionStorage містить поточну вправу та ідентифікатор часової сесії. Service Worker кешує публічні файли, а не відповіді Supabase. Аналітичних і рекламних cookie у коді не знайдено. Окремий локальний Python-сервер має cookie svsession на 30 днів; GitHub Pages його не запускає."], ["Зовнішні сервіси", "GitHub Pages розміщує сайт. Supabase забезпечує Auth, PostgreSQL і приватне сховище аватарів. SDK надходить із jsDelivr, шрифти — з Google Fonts. Код має підключення до Pexels/Wikimedia; усі 1006 навчальних фото зараз локальні. Відео відкривають сайти правовласників, зокрема UR Play і SVT. Синтез мовлення залежить від браузера/голосу та може використовувати сервіси пристрою. Зовнішні запити передають мережеві відомості, як-от IP-адресу. BLOCKER: перевірити реальний регіон Supabase, договори обробки, субпідрядників і міжнародні передачі."], ["Строки й видалення", "Код не встановлює автоматичного строку видалення історії навчання, подій і більшості локальних записів. Вихід не видаляє хмарний прогрес. Очищення браузера може втратити несинхронізовані дані, але не видаляє акаунт Supabase. SQL містить лише початкове блокування за запитом на видалення до очищення Storage. Завершеної процедури видалення Auth-користувача, файлів, резервних копій і журналів немає. BLOCKER: визначити строки/критерії за категоріями, фактичне зберігання backup/logs, контакт і перевірену процедуру видалення. Тариф сервісу не підтверджує налаштування цього проєкту."], ["Права та уточнення", "Залежно від підстави й обставин GDPR передбачає доступ, виправлення, видалення, обмеження, переносимість, заперечення, відкликання згоди та скаргу наглядовому органу. Відкликання не впливає на попередню правомірну обробку. BLOCKER: надати робочий канал запитів і процедуру перевірки особи/відповіді; підтвердити орган нагляду, умови для неповнолітніх і рішення/профілювання за статтею 22. Основа: GDPR, статті 5–7 і 12–22. Чернетка не засвідчує повну відповідність."]]]};const lang=((()=>{try{return localStorage.getItem('sv-language')}catch(_){return null}})()||'ru').toLowerCase();const active=I18N[lang]||I18N.ru;const labels={ru:['← Вернуться на сайт','Перед публикацией укажите владельца сервиса, контактный адрес и проверьте юридические условия.'],en:['← Back to site','Before public launch, add the service owner and contact details and review these legal terms.'],sv:['← Tillbaka till webbplatsen','Fyll i ägare och kontaktuppgifter och granska juridiken före offentlig lansering.'],uk:['← Повернутися на сайт','До публічного запуску вкажіть власника, контакти й перевірте юридичні умови.']}[lang]||['← Back','This draft needs owner details'];document.documentElement.lang=lang;document.querySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];text.textContent=item[1];sec.append(h,text);parent.append(sec)});</script></body></html>
