<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Svenska Lätt | privacy</title><link rel="icon" href="./favicon.svg"><style>:root{--ink:#292444;--purple:#6257e7}*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:var(--ink);margin:0;background:linear-gradient(145deg,#f4f2ff,#ecf9ff)}main{max-width:840px;margin:5vh auto;padding:clamp(20px,4vw,48px);border-radius:25px;background:#fff;box-shadow:0 20px 60px #302b781a}header{display:flex;gap:13px;align-items:center;margin-bottom:22px}header img{width:48px;height:48px}header strong{font-size:19px}.back{display:inline-flex;margin-bottom:22px;color:#4a39ba;font-weight:800;text-decoration:none;padding:8px 12px;border:1px solid #ded6ff;border-radius:10px}h1{font-size:clamp(27px,4vw,36px);line-height:1.2;margin:0 0 17px}h2{font-size:18px;margin-bottom:7px}section{padding:12px 0;border-bottom:1px solid #ececf3}section:last-of-type{border:0}p{margin:0 0 10px;color:#5c5d76}.warning{padding:14px 18px;background:#fff5df;border:1px solid #f1d49a;border-radius:13px;margin-bottom:20px}footer{font-size:13px;color:#75758b;margin-top:30px}@media(max-width:890px){main{margin:10px;border-radius:18px}}</style></head><body><main><header><img src="./favicon.svg" alt=""><strong>Svenska Lätt</strong></header><a class="back" href="./index.html#home" id="back">← Back</a><h1 id="heading"></h1><div class="warning" id="warning"></div><div id="parts"></div><p><a href="https://eur-lex.europa.eu/eli/reg/2016/679/oj" target="_blank" rel="noopener noreferrer">GDPR</a> · <a href="https://supabase.com/docs/guides/platform/backups" target="_blank" rel="noopener noreferrer">Supabase backups</a></p><footer>© 2026 Svenska Lätt · <a href="./index.html#home">Home</a></footer></main><script>const I18N={"ru": ["Конфиденциальность — черновик, BLOCKER", [["Владелец и контакт", "Svenska Lätt принадлежит физическому лицу, а не компании. Публичный контакт по вопросам поддержки и персональных данных: yuliia.milena@gmail.com. Полное юридическое имя владельца и почтовый адрес пока не предоставлены. BLOCKER: идентификационные сведения владельца необходимо дополнить до завершения документа."], ["Какие данные и зачем", "Гостевой прогресс хранится в браузере. Для аккаунта Supabase обрабатывает email и данные авторизации; приложение сохраняет имя и данные профиля, уровень SFI, настройки языка, XP, ответы и результаты тестов, достижения, избранное, изученные слова, повторения и даты активности. Это используется для входа, синхронизации, упражнений и статистики. BLOCKER: контролёр должен подтвердить правовое основание для каждой цели и необходимые/необязательные поля."], ["Учебное время и согласие", "Активное учебное время учитывается по умолчанию для вошедшего аккаунта согласно текущей настройке сервиса. Выключатель в кабинете позволяет остановить учёт; явное выключение сохраняется. Записываются интервалы активности, дневные суммы и автоматически определённый часовой пояс. Скрытая вкладка, отсутствие фокуса и бездействие приостанавливают учёт. Уже записанное время при выключении не удаляется. BLOCKER: контролёр должен подтвердить правовое основание этой обработки; включённая настройка по умолчанию сама по себе не является отдельным согласием."], ["Хранение в браузере и cookies", "localStorage содержит гостевой прогресс, настройки, выбор cookies, выбор учёта времени и данные сессии Supabase. Старые локальные данные аккаунта не импортируются автоматически. IndexedDB хранит очереди событий и интервалов до подтверждения; отдельные подтверждённые и отклонённые записи могут оставаться без автоматического удаления. sessionStorage хранит текущую тренировку и идентификатор временной сессии. Service Worker кеширует публичные файлы и изображения, а не ответы Supabase. Аналитические и рекламные cookies в коде не обнаружены. Локальный Python-сервер имеет отдельную cookie svsession на 30 дней; GitHub Pages этот сервер не запускает."], ["Получатели и внешние сервисы", "GitHub Pages размещает сайт; Supabase используется для Auth, PostgreSQL и приватного хранилища аватаров. SDK загружается с jsDelivr, шрифты — с Google Fonts. В коде есть подключения к Pexels и Wikimedia; текущие 1006 учебных фото включены локально. Внешние видео открываются на сайтах правообладателей, включая UR Play и SVT. Синтез речи зависит от браузера и установленного голоса и может использовать сервис устройства. При внешних запросах сервисам передаются сетевые сведения, например IP-адрес. BLOCKER: проверить фактический регион Supabase, договоры обработки, субподрядчиков и международные передачи."], ["Хранение и запросы на удаление", "По вопросам удаления аккаунта и персональных данных можно написать на yuliia.milena@gmail.com. В коде проекта найден только начальный этап запроса удаления: аккаунт блокируется до очистки файлов Storage. Завершённая процедура удаления пользователя Supabase Auth, связанных данных и файлов, а также обработка резервных копий и журналов не подтверждены. Автоматическое удаление в определённый срок не обещается. Выход из аккаунта и закрытие вкладки не удаляют облачный прогресс. Очистка данных браузера может удалить несинхронизированный прогресс, но не удаляет аккаунт Supabase. BLOCKER: подтвердить полный порядок удаления и реальные сроки или критерии хранения, включая резервные копии и журналы."], ["Права и обязательные уточнения", "В зависимости от основания и обстоятельств GDPR предусматривает доступ, исправление, удаление, ограничение обработки, переносимость, возражение, отзыв согласия и жалобу в надзорный орган. По вопросам реализации прав можно написать на yuliia.milena@gmail.com. Выключение учёта времени не влияет на правомерность предшествующей обработки. BLOCKER: подтвердить ответственное лицо, порядок проверки личности и обработки запросов, применимый надзорный орган, условия для несовершеннолетних и наличие решений/профилирования по статье 22. Этот черновик не является заявлением о полном соответствии."]]], "en": ["Privacy — draft, BLOCKER", [["Owner and contact", "Svenska Lätt is owned by a private individual, not a company. Public contact for support and personal data requests: yuliia.milena@gmail.com. The owner’s full legal name and postal address have not yet been provided. BLOCKER: the owner’s identification details must be completed before this document is finalized."], ["Data and purposes", "Guest progress stays in the browser. Supabase handles account email and authentication. The app stores profile data/name, SFI level, language settings, XP, answers and learning results, achievements, favorites, known words, reviews and activity dates for sign-in, synchronization, exercises and statistics. BLOCKER: confirm the legal basis for each purpose and which fields are required."], ["Study time and consent", "Active study time is tracked by default for signed-in accounts according to the current service setting. The account switch stops tracking and retains an explicit opt-out. Activity intervals, daily totals and the automatically detected time zone are stored. Hidden/unfocused tabs and inactivity pause tracking. Switching off does not delete recorded time. BLOCKER: the controller must confirm the legal basis; a default-on setting is not a separate consent."], ["Browser storage and cookies", "localStorage holds guest progress, preferences, cookie choice, study-time preference and the Supabase session. Legacy account data is not imported automatically. IndexedDB holds event/time queues; some acknowledged or rejected records remain without automatic expiry. sessionStorage holds the current exercise and time lease ID. The Service Worker caches public assets, not Supabase responses. No analytics or advertising cookies were found in the code. The separate local Python server uses a 30-day svsession cookie; it does not run on GitHub Pages."], ["Services and recipients", "GitHub Pages hosts the site. Supabase supplies Auth, PostgreSQL and private avatar storage. jsDelivr delivers the SDK; Google Fonts delivers fonts. Code includes Pexels/Wikimedia connections; all 1006 current study photos are local assets. Video links open publishers such as UR Play and SVT. Speech synthesis depends on the browser/voice and may use device services. External requests disclose network information such as IP addresses. BLOCKER: verify the actual Supabase region, processing agreements, subprocessors and international transfers."], ["Retention and erasure requests", "Account and personal data erasure requests can be sent to yuliia.milena@gmail.com. The project code implements only the initial deletion-request stage: the account is frozen pending Storage file cleanup. A complete procedure for deleting the Supabase Auth user, associated data and files, and handling backups and logs has not been confirmed. Automatic deletion within a specified period is not promised. Signing out or closing a tab does not erase cloud progress. Clearing browser data may remove unsynchronized progress but does not delete the Supabase account. BLOCKER: confirm the complete erasure process and actual retention periods or criteria, including backups and logs."], ["Rights and outstanding details", "Depending on the legal basis and circumstances, GDPR provides rights of access, rectification, erasure, restriction, portability, objection, consent withdrawal and complaint to a supervisory authority. Requests concerning these rights can be sent to yuliia.milena@gmail.com. Withdrawal does not affect prior lawful processing. BLOCKER: confirm the responsible individual, identity-verification and request-handling procedures, applicable supervisory authority, rules for minors and any Article 22 decision-making/profiling. This draft does not certify compliance."]]], "sv": ["Integritet — utkast, BLOCKER", [["Ägare och kontakt", "Svenska Lätt ägs av en privatperson, inte av ett företag. Offentlig kontakt för support och frågor om personuppgifter: yuliia.milena@gmail.com. Ägarens fullständiga juridiska namn och postadress har ännu inte angetts. BLOCKER: ägarens identitetsuppgifter måste kompletteras innan dokumentet är färdigt."], ["Uppgifter och ändamål", "Gästframsteg lagras i webbläsaren. Supabase hanterar e-post och autentisering. Appen lagrar profil/namn, SFI-nivå, språkval, XP, svar och testresultat, prestationer, favoriter, inlärda ord, repetition och aktivitetsdatum för inloggning, synkronisering, övningar och statistik. BLOCKER: bekräfta rättslig grund per ändamål och obligatoriska fält."], ["Samtycke till studietid", "Aktiv studietid registreras som standard för inloggade konton enligt tjänstens inställning. Reglaget i profilen stoppar registreringen och ett uttryckligt avval sparas. Aktivitetsintervall, dagssummor och automatiskt identifierad tidszon lagras. Dold flik, förlorat fokus och inaktivitet pausar registreringen. Tid som redan sparats raderas inte. BLOCKER: ansvarig måste bekräfta rättslig grund; en standardinställning är inte ett separat samtycke."], ["Lokal lagring och kakor", "localStorage innehåller gästframsteg, inställningar, kakval, tidsinställning och Supabase-sessionen. Äldre kontodata importeras inte automatiskt. IndexedDB lagrar händelse- och tidsköer; vissa bekräftade/avvisade poster saknar automatisk gallring. sessionStorage lagrar pågående övning och tids-ID. Service Worker cachar offentliga filer, inte Supabase-svar. Inga analys- eller reklamkakor hittades i koden. Den separata lokala Python-servern använder svsession i 30 dagar; den körs inte på GitHub Pages."], ["Externa tjänster", "GitHub Pages är webbhotell. Supabase används för Auth, PostgreSQL och privat avatarlagring. SDK hämtas från jsDelivr och typsnitt från Google Fonts. Koden ansluter även till Pexels/Wikimedia; alla 1006 aktuella studiefoton finns lokalt. Videolänkar öppnar bland annat UR Play och SVT. Talsyntes beror på webbläsare/röst och kan använda enhetstjänster. Externa anrop överför nätverksuppgifter som IP-adress. BLOCKER: verifiera faktisk Supabase-region, biträdesavtal, underbiträden och internationella överföringar."], ["Lagring och begäran om radering", "Begäran om radering av konto och personuppgifter kan skickas till yuliia.milena@gmail.com. Projektkoden innehåller bara det första steget: kontot spärras i väntan på rensning av Storage-filer. En fullständig rutin för radering av Supabase Auth-användaren, tillhörande uppgifter och filer samt hantering av säkerhetskopior och loggar har inte bekräftats. Automatisk radering inom en bestämd tid utlovas inte. Utloggning eller stängning av fliken raderar inte molnframsteg. Rensning i webbläsaren kan ta bort osynkroniserade framsteg men raderar inte Supabase-kontot. BLOCKER: bekräfta hela raderingsrutinen och faktiska lagringstider eller kriterier, inklusive säkerhetskopior och loggar."], ["Rättigheter och återstående uppgifter", "GDPR ger, beroende på grund och omständigheter, rätt till tillgång, rättelse, radering, begränsning, portabilitet, invändning, återkallat samtycke och klagomål till tillsynsmyndighet. Frågor om dessa rättigheter kan skickas till yuliia.milena@gmail.com. Återkallelse påverkar inte tidigare laglig behandling. BLOCKER: bekräfta ansvarig person, rutin för identitetskontroll och hantering av begäranden, tillämplig myndighet, villkor för minderåriga och eventuell profilering/beslut enligt artikel 22. Utkastet intygar inte full efterlevnad."]]], "uk": ["Конфіденційність — чернетка, BLOCKER", [["Власник і контакт", "Svenska Lätt належить фізичній особі, а не компанії. Публічний контакт із питань підтримки та персональних даних: yuliia.milena@gmail.com. Повне юридичне ім’я власника та поштова адреса поки не надані. BLOCKER: відомості для ідентифікації власника потрібно доповнити до завершення документа."], ["Дані та мета", "Гостьовий прогрес зберігається в браузері. Supabase обробляє email та авторизацію. Зберігаються профіль/ім’я, рівень SFI, мова, XP, відповіді й результати тестів, досягнення, вибране, вивчені слова, повторення та дати активності для входу, синхронізації, вправ і статистики. BLOCKER: підтвердити правову підставу для кожної мети й обов’язкові поля."], ["Згода на облік часу", "Активний навчальний час обліковується за замовчуванням для авторизованого акаунта згідно з налаштуванням сервісу. Перемикач у кабінеті зупиняє облік, явне вимкнення зберігається. Записуються інтервали, денні підсумки й автоматично визначений часовий пояс. Прихована вкладка, втрата фокуса й бездіяльність призупиняють облік. Попередні записи не видаляються. BLOCKER: контролер має підтвердити правову підставу; типове ввімкнення не є окремою згодою."], ["Браузерне зберігання й cookie", "localStorage містить гостьовий прогрес, налаштування, вибір cookie, вибір обліку часу й сесію Supabase. Старі локальні дані акаунта не імпортуються автоматично. IndexedDB зберігає черги подій/часу; деякі підтверджені й відхилені записи лишаються без автоматичного очищення. sessionStorage містить поточну вправу та ідентифікатор часової сесії. Service Worker кешує публічні файли, а не відповіді Supabase. Аналітичних і рекламних cookie у коді не знайдено. Окремий локальний Python-сервер має cookie svsession на 30 днів; GitHub Pages його не запускає."], ["Зовнішні сервіси", "GitHub Pages розміщує сайт. Supabase забезпечує Auth, PostgreSQL і приватне сховище аватарів. SDK надходить із jsDelivr, шрифти — з Google Fonts. Код має підключення до Pexels/Wikimedia; усі 1006 навчальних фото зараз локальні. Відео відкривають сайти правовласників, зокрема UR Play і SVT. Синтез мовлення залежить від браузера/голосу та може використовувати сервіси пристрою. Зовнішні запити передають мережеві відомості, як-от IP-адресу. BLOCKER: перевірити реальний регіон Supabase, договори обробки, субпідрядників і міжнародні передачі."], ["Зберігання та запити на видалення", "Із запитом на видалення акаунта й персональних даних можна звернутися на yuliia.milena@gmail.com. У коді проєкту є лише початковий етап: акаунт блокується до очищення файлів Storage. Повну процедуру видалення користувача Supabase Auth, пов’язаних даних і файлів, а також обробку резервних копій і журналів не підтверджено. Автоматичне видалення у визначений строк не обіцяється. Вихід з акаунта й закриття вкладки не видаляють хмарний прогрес. Очищення браузера може видалити несинхронізований прогрес, але не видаляє акаунт Supabase. BLOCKER: підтвердити повну процедуру видалення й фактичні строки або критерії зберігання, включно з резервними копіями та журналами."], ["Права та уточнення", "Залежно від підстави й обставин GDPR передбачає доступ, виправлення, видалення, обмеження, переносимість, заперечення, відкликання згоди та скаргу наглядовому органу. Щодо реалізації цих прав можна звернутися на yuliia.milena@gmail.com. Відкликання не впливає на попередню правомірну обробку. BLOCKER: підтвердити відповідальну особу, процедури перевірки особи й опрацювання запитів, наглядовий орган, умови для неповнолітніх і рішення/профілювання за статтею 22. Ця чернетка не засвідчує повну відповідність."]]]};const lang=((()=>{try{return localStorage.getItem('sv-language')}catch(_){return null}})()||'ru').toLowerCase();const active=I18N[lang]||I18N.ru;const labels={"ru": ["← Вернуться на сайт", "Черновик: полное юридическое имя владельца, почтовый адрес, сроки хранения и окончательная процедура удаления ещё не подтверждены. Публичный контакт указан ниже."], "en": ["← Back to site", "Draft: the owner’s full legal identity, postal address, retention periods and final erasure process remain unconfirmed. The public contact is listed below."], "sv": ["← Tillbaka till webbplatsen", "Utkast: ägarens fullständiga juridiska identitet, postadress, lagringstider och slutliga raderingsrutin är ännu inte bekräftade. Offentlig kontakt anges nedan."], "uk": ["← Повернутися на сайт", "Чернетка: повне юридичне ім’я власника, поштова адреса, строки зберігання та остаточна процедура видалення ще не підтверджені. Публічний контакт наведено нижче."]}[lang]||['← Back','Draft: owner details and erasure procedure remain unconfirmed.'];document.documentElement.lang=lang;document.querySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];item[1].split('yuliia.milena@gmail.com').forEach((part,index)=>{if(index){const link=document.createElement('a');link.href='mailto:yuliia.milena@gmail.com';link.textContent='yuliia.milena@gmail.com';text.append(link)}text.append(document.createTextNode(part))});sec.append(h,text);parent.append(sec)});</script></body></html>
