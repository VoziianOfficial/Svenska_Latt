<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Svenska Lätt | privacy</title><link rel="icon" href="./favicon.svg"><style>:root{--ink:#292444;--purple:#6257e7}*{box-sizing:border-box}body{font:16px/1.7 system-ui,sans-serif;color:var(--ink);margin:0;background:linear-gradient(145deg,#f4f2ff,#ecf9ff)}main{max-width:840px;margin:5vh auto;padding:clamp(20px,4vw,48px);border-radius:25px;background:#fff;box-shadow:0 20px 60px #302b781a}header{display:flex;gap:13px;align-items:center;margin-bottom:22px}header img{width:48px;height:48px}header strong{font-size:19px}.back{display:inline-flex;margin-bottom:22px;color:#4a39ba;font-weight:800;text-decoration:none;padding:8px 12px;border:1px solid #ded6ff;border-radius:10px}h1{font-size:clamp(27px,4vw,36px);line-height:1.2;margin:0 0 17px}h2{font-size:18px;margin-bottom:7px}section{padding:12px 0;border-bottom:1px solid #ececf3}section:last-of-type{border:0}p{margin:0 0 10px;color:#5c5d76}.warning{padding:14px 18px;background:#fff5df;border:1px solid #f1d49a;border-radius:13px;margin-bottom:20px}footer{font-size:13px;color:#75758b;margin-top:30px}@media(max-width:890px){main{margin:10px;border-radius:18px}}</style></head><body><main><header><img src="./favicon.svg" alt=""><strong>Svenska Lätt</strong></header><a class="back" href="./index.html#home" id="back">← Back</a><h1 id="heading"></h1><div class="warning" id="warning"></div><div id="parts"></div><footer>© 2026 Svenska Lätt · <a href="./index.html#home">Home</a></footer></main><script>const I18N={"ru": ["Политика конфиденциальности", [["1. Кто обрабатывает данные", "Владелец и контактный адрес платформы должны быть указаны до публичного запуска. Пока эта информация не заполнена, документ является шаблоном."], ["2. Какие данные используются", "В гостевом режиме локально на устройстве хранятся учебный прогресс, предпочтения языка, выбранный уровень, избранное, история повторения и настройки интерфейса. При подключении аккаунта могут дополнительно обрабатываться email, имя, фотография и данные прогресса в облаке."], ["3. Для чего обрабатываются данные", "Чтобы показывать упражнения, сохранять результаты обучения, поддерживать вход и синхронизацию. Законное основание и период хранения для облачных аккаунтов определяются перед запуском."], ["4. Сторонние сервисы", "Ссылки на видео открывают страницы UR Play и других правообладателей. Изображения при наличии загружаются с внешних фотохостингов. Для облачных аккаунтов планируется Supabase, параметры защиты и регион хранения уточняются при подключении."], ["5. Права пользователя", "После запуска оператор должен обеспечить информацию о доступе к данным, исправлении и удалении, переносимости при применимости, возражениях и обращении к надзорному органу. До настройки оператора заявления следует направлять через опубликованный контакт."], ["6. Дата", "Редакция: 14 октября 2026 г."]]], "en": ["Privacy policy", [["1. Data controller", "The platform owner and contact details must be inserted before public launch. Until then this is a template."], ["2. Information used", "Guest mode stores learning progress, language preferences, level, favourites and review history in browser storage. Once accounts are configured, the service may also process email, display name, profile picture and synced progress."], ["3. Purposes", "To deliver learning features and optionally manage accounts and synchronisation. Legal basis and retention schedule must be set by the controller before launch."], ["4. Other providers", "Links to UR Play and other video hosts open their services. Some photos load from external hosts. Supabase is planned for authentication and cloud storage."], ["5. Your rights", "The operator must provide means to access, correct or erase personal data, and other applicable GDPR rights, together with a contact for complaints."], ["6. Date", "Last updated: 14 October 2026."]]], "sv": ["Integritetspolicy", [["1. Personuppgiftsansvarig", "Plattformens ägare och kontaktuppgifter måste anges före offentlig lansering. Detta är tills vidare en mall."], ["2. Uppgifter", "I gästläget lagras studieframsteg, språkval, nivå, favoriter och repetition lokalt i webbläsaren. Vid aktiverade konton kan även e-post, visningsnamn, profilbild och synkroniserade framsteg behandlas."], ["3. Ändamål", "Att tillhandahålla undervisning, inloggning och synkronisering. Rättslig grund och lagringstid ska fastställas av ansvarig före lanseringen."], ["4. Andra tjänster", "Externa videolänkar öppnar bland annat UR Play. Vissa bilder laddas från externa värdar. Supabase planeras för konton och lagring."], ["5. Dina rättigheter", "Den ansvarige behöver ange hur du kan få tillgång till, rätta eller radera dina uppgifter och utöva andra tillämpliga rättigheter enligt GDPR."], ["6. Datum", "Uppdaterad: 14 oktober 2026."]]], "uk": ["Політика конфіденційності", [["1. Відповідальний за дані", "Дані власника платформи та контакти необхідно вказати до публічного запуску. Поки це шаблон документа."], ["2. Які дані використовуються", "У гостьовому режимі прогрес, мова, рівень, вибране й повторення зберігаються локально в браузері. Після підключення акаунтів додатково можуть оброблятися email, ім’я, фото та синхронізований прогрес."], ["3. Мета", "Забезпечення навчання, входу та синхронізації. Правову підставу і строки зберігання визначає відповідальна особа до запуску."], ["4. Сторонні сервіси", "Посилання на відео відкривають UR Play та інші сайти. Деякі фото завантажуються із зовнішніх джерел. Планується використання Supabase."], ["5. Права", "Власник має надати можливість доступу, виправлення чи видалення даних та реалізації інших застосовних прав за GDPR."], ["6. Дата", "Оновлено: 14 жовтня 2026 року."]]]};const lang=(localStorage.getItem('sv-language')||'ru').toLowerCase();const active=I18N[lang]||I18N.ru;const labels={ru:['← Вернуться на сайт','Перед публикацией укажите владельца сервиса, контактный адрес и проверьте юридические условия.'],en:['← Back to site','Before public launch, add the service owner and contact details and review these legal terms.'],sv:['← Tillbaka till webbplatsen','Fyll i ägare och kontaktuppgifter och granska juridiken före offentlig lansering.'],uk:['← Повернутися на сайт','До публічного запуску вкажіть власника, контакти й перевірте юридичні умови.']}[lang]||['← Back','This draft needs owner details'];document.documentElement.lang=lang;document.querySelector('#back').textContent=labels[0];document.querySelector('#heading').textContent=active[0];document.querySelector('#warning').textContent=labels[1];const parent=document.querySelector('#parts');active[1].forEach(item=>{const sec=document.createElement('section'),h=document.createElement('h2'),text=document.createElement('p');h.textContent=item[0];text.textContent=item[1];sec.append(h,text);parent.append(sec)});</script></body></html>
